
name: DG PS2 Unpacker V04

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo original
        run: |
          git clone https://github.com/ps2homebrew/ps2-unpacker.git src

      - name: Instalar compilador Windows
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686

      - name: Aplicar correcoes V04
        run: |
          cd src

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("Interpreter.c")
          s = p.read_text()

          old = "void UnknownOpcode() {"

          new = r"""void UnknownOpcode() {
              /* DG V01 - TEQ */
              if ((cpuRegs.code & 0xFC00003F) == 0x34) {
                  if (cpuRegs.GPR.r[_Rs_].UD[0] !=
                      cpuRegs.GPR.r[_Rt_].UD[0]) {
                      return;
                  }

                  printf("\nDG: TEQ trap at %08X\n",
                         cpuRegs.pc - 4);
                  exit(-1);
              }
          """

          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          pattern = r'(void\s+SYSCALL\s*\([^)]*\)\s*\{)'

          patch = r'''
              /* DG V02 - GetThreadId */
              if (cpuRegs.GPR.r[3].UL[0] == 0x2F) {
                  cpuRegs.GPR.r[2].UD[0] = 1;
                  printf("DG: GetThreadId = 1\n");
                  return;
              }

              /* DG V03 - WaitSema */
              if (cpuRegs.GPR.r[3].UL[0] == 0x44) {
                  cpuRegs.GPR.r[2].UD[0] =
                      cpuRegs.GPR.r[4].UL[0];

                  printf("DG: WaitSema(%08X) simulated\n",
                         cpuRegs.GPR.r[4].UL[0]);
                  return;
              }
          '''

          s, n = re.subn(
              pattern,
              lambda m: m.group(0) + patch,
              s
          )

          assert n == 1, "SYSCALL nao localizado"

          # V04 - Historico circular de instrucoes.
          old = "void execI() {"

          new = r'''
          #define DG_HISTORY 512

          static struct {
              u32 pc;
              u32 opcode;
              u32 regs[32];
          } dg_history[DG_HISTORY];

          static unsigned int dg_count = 0;

          static void dg_record(u32 pc) {
              unsigned int i;
              unsigned int slot = dg_count % DG_HISTORY;

              dg_history[slot].pc = pc;
              dg_history[slot].opcode = cpuRegs.code;

              for (i = 0; i < 32; i++)
                  dg_history[slot].regs[i] =
                      cpuRegs.GPR.r[i].UL[0];

              dg_count++;
          }

          static void dg_dump(void) {
              unsigned int i, j, k;
              unsigned int start =
                  dg_count > DG_HISTORY ?
                  dg_count - DG_HISTORY : 0;

              printf("\n=== DG V04 REGISTER HISTORY ===\n");

              for (i = start; i < dg_count; i++) {
                  j = i % DG_HISTORY;

                  printf("\nPC=%08X OP=%08X\n",
                         dg_history[j].pc,
                         dg_history[j].opcode);

                  for (k = 0; k < 32; k++) {
                      printf("R%02u=%08X ",
                             k, dg_history[j].regs[k]);

                      if ((k & 3) == 3)
                          printf("\n");
                  }
              }

              printf("\n=== END HISTORY ===\n");
              fflush(stdout);
          }

          void execI() {
          '''

          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = "Int_OpcodePrintTable[cpuRegs.code >> 26]();"

          new = r'''
              dg_record(pc);

              if (pc == 0x01D02550 &&
                  cpuRegs.GPR.r[16].UL[0] >= 0x02000000) {

                  printf("\nDG: Invalid S0 detected\n");
                  printf("S0=%08X S1=%08X S3=%08X\n",
                         cpuRegs.GPR.r[16].UL[0],
                         cpuRegs.GPR.r[17].UL[0],
                         cpuRegs.GPR.r[19].UL[0]);

                  dg_dump();
              }

              Int_OpcodePrintTable[cpuRegs.code >> 26]();
          '''

          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          p.write_text(s)
          print("Correcoes V01-V04 aplicadas.")
          PY

      - name: Compilar V04
        run: |
          cd src

          i686-w64-mingw32-gcc \
            -std=gnu99 \
            -O2 \
            -fcommon \
            -I. \
            '-DVERSION="DG-V04"' \
            InterTables.c \
            Interpreter.c \
            memory.c \
            ps2-unpacker.c \
            DisR5900asm.c \
            DisR5900.c \
            MMI.c \
            -o DG-PS2-Unpacker.exe

      - name: Criar pacote
        run: |
          mkdir -p output
          cp src/DG-PS2-Unpacker.exe output/
          cp src/LICENSE output/
          cp -r src output/source

      - name: Disponibilizar download
        uses: actions/upload-artifact@v4
        with:
          name: DG-PS2-Unpacker-V04
          path: output/
