
name: DG PS2 Unpacker V09

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo original
        run: |
          git clone https://github.com/ps2homebrew/ps2-unpacker.git src

      - name: Instalar compilador Windows
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686

      - name: Aplicar correcoes V09
        run: |
          cd src

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("Interpreter.c")
          s = p.read_text()

          old = "void UnknownOpcode() {"

          new = r"""void UnknownOpcode() {
              /* DG V01 - TEQ */
              if ((cpuRegs.code & 0xFC00003F) == 0x34) {
                  if (cpuRegs.GPR.r[_Rs_].UD[0] !=
                      cpuRegs.GPR.r[_Rt_].UD[0]) {
                      return;
                  }

                  printf("\nDG: TEQ trap at %08X\n",
                         cpuRegs.pc - 4);
                  exit(-1);
              }
          """

          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          pattern = r'(void\s+SYSCALL\s*\([^)]*\)\s*\{)'

          patch = r'''
              /* DG V02 - GetThreadId */
              if (cpuRegs.GPR.r[3].UL[0] == 0x2F) {
                  cpuRegs.GPR.r[2].UD[0] = 1;
                  printf("DG: GetThreadId = 1\n");
                  return;
              }

              /* DG V03 - WaitSema */
              if (cpuRegs.GPR.r[3].UL[0] == 0x44) {
                  cpuRegs.GPR.r[2].UD[0] =
                      cpuRegs.GPR.r[4].UL[0];

                  printf("DG: WaitSema(%08X) simulated\n",
                         cpuRegs.GPR.r[4].UL[0]);
                  return;
              }

              /* DG V07 - SignalSema */
              if (cpuRegs.GPR.r[3].UL[0] == 0x42) {
                  cpuRegs.GPR.r[2].UD[0] =
                      cpuRegs.GPR.r[4].UL[0];

                  printf("DG: SignalSema(%08X) simulated\n",
                         cpuRegs.GPR.r[4].UL[0]);
                  return;
              }
          '''

          s, n = re.subn(
              pattern,
              lambda m: m.group(0) + patch,
              s
          )

          assert n == 1

          # DG V09 - Limites da pilha e heap

          old = "u32 gp, stack, stack_size, args, root, heap_start, heap_size;"

          new = r'''
          u32 gp, stack, stack_size, args, root, heap_start, heap_size;

          #define DG_RAM_END 0x02000000u

          static u32 dg_stack_bottom = 0;
          static u32 dg_stack_top = 0;
          static u32 dg_heap_end = 0;
          '''

          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          pattern = (
              r'case\s+0x3c\s*:'
              r'[\s\S]*?'
              r'(?=case\s+0x64\s*:)'
          )

          replacement = r'''
              case 0x3c: /* DG V09 - SetupThread */

                  gp = cpuRegs.GPR.n.a0.UL[0];
                  stack = cpuRegs.GPR.n.a1.UL[0];
                  stack_size = cpuRegs.GPR.n.a2.UL[0];
                  args = cpuRegs.GPR.n.a3.UL[0];
                  root = cpuRegs.GPR.n.t0.UL[0];

                  if (stack_size < 16 ||
                      stack_size >= DG_RAM_END) {

                      printf("DG: Invalid stack size\n");
                      exit(-1);
                  }

                  if (stack == 0xFFFFFFFFu) {

                      dg_stack_top = DG_RAM_END;
                      dg_stack_bottom =
                          dg_stack_top - stack_size;

                  } else {

                      if (stack >= DG_RAM_END ||
                          stack_size > DG_RAM_END - stack) {

                          printf("DG: Invalid stack region\n");
                          exit(-1);
                      }

                      dg_stack_bottom = stack;
                      dg_stack_top = stack + stack_size;
                  }

                  dg_stack_top &= ~15u;

                  cpuRegs.GPR.n.v0.UD[0] =
                      dg_stack_top - 16;

                  printf("\nDG V09: SetupThread\n");
                  printf("Stack bottom = %08X\n",
                         dg_stack_bottom);
                  printf("Stack top    = %08X\n",
                         dg_stack_top);
                  printf("Returned SP  = %08X\n",
                         cpuRegs.GPR.n.v0.UL[0]);

                  return;

              case 0x3d: /* DG V09 - SetupHeap */

                  heap_start = cpuRegs.GPR.n.a0.UL[0];
                  heap_size = cpuRegs.GPR.n.a1.UL[0];

                  if (!dg_stack_bottom ||
                      heap_start >= dg_stack_bottom) {

                      printf("DG: Invalid heap start\n");
                      exit(-1);
                  }

                  if (heap_size == 0xFFFFFFFFu) {

                      dg_heap_end = dg_stack_bottom;

                  } else {

                      if (heap_size >
                          dg_stack_bottom - heap_start) {

                          printf("DG: Heap overlaps stack\n");
                          exit(-1);
                      }

                      dg_heap_end = heap_start + heap_size;
                  }

                  dg_heap_end &= ~15u;

                  if (dg_heap_end < heap_start) {
                      printf("DG: Invalid aligned heap end\n");
                      exit(-1);
                  }

                  printf("\nDG V09: SetupHeap\n");
                  printf("Heap start = %08X\n",
                         heap_start);
                  printf("Heap end   = %08X\n",
                         dg_heap_end);
                  printf("Heap bytes = %08X\n",
                         dg_heap_end - heap_start);

                  return;

              case 0x3e: /* DG V09 - EndOfHeap */

                  if (!dg_heap_end) {
                      printf("DG: Heap not initialized\n");
                      exit(-1);
                  }

                  cpuRegs.GPR.n.v0.UD[0] = dg_heap_end;

                  printf("\nDG V09: EndOfHeap = %08X\n",
                         dg_heap_end);

                  return;

              '''

          s, n = re.subn(
              pattern,
              lambda m: replacement,
              s
          )

          assert n == 1, "SetupThread/Heap nao localizados"

          # DG V09 - Diagnostico reduzido do decoder

          old = "Int_OpcodePrintTable[cpuRegs.code >> 26]();"

          new = r'''
              if (pc == 0x01D00360) {

                  printf("\nDG: Decoder entry\n");
                  printf("A0=%08X A1=%08X A2=%08X A3=%08X SP=%08X\n",
                         cpuRegs.GPR.r[4].UL[0],
                         cpuRegs.GPR.r[5].UL[0],
                         cpuRegs.GPR.r[6].UL[0],
                         cpuRegs.GPR.r[7].UL[0],
                         cpuRegs.GPR.r[29].UL[0]);
              }

              if (pc == 0x01D00438 &&
                  cpuRegs.GPR.r[14].UL[0] >= DG_RAM_END) {

                  printf("\nDG: Invalid decoder address\n");
                  printf("T2=%08X T6=%08X SP=%08X\n",
                         cpuRegs.GPR.r[10].UL[0],
                         cpuRegs.GPR.r[14].UL[0],
                         cpuRegs.GPR.r[29].UL[0]);
              }

              Int_OpcodePrintTable[cpuRegs.code >> 26]();
          '''

          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          p.write_text(s)

          # DG V06 - Correcao de gravacao de 128 bits

          p = Path("memory.c")
          s = p.read_text()

          pattern = (
              r'void\s+memWrite128\s*'
              r'\(u32\s+mem,\s*u64\s*\*\s*value\)'
              r'\s*\{[^{}]*\}'
          )

          replacement = r'''
          void memWrite128(u32 mem, u64 *value)
          {
              unsigned int i;
              const u8 *bytes = (const u8 *)value;

              for (i = 0; i < 16; i++) {
                  memWrite8(mem + i, bytes[i]);
              }
          }
          '''

          s, n = re.subn(
              pattern,
              lambda m: replacement,
              s
          )

          assert n == 1

          old = "memset(tags, 0, MEMSIZE);"

          new = r'''
              memset(tags, 0, MEMSIZE);
              printf("DG V09: Corrected 128-bit memory writes\n");
              printf("DG V09: Stack and heap management enabled\n");
          '''

          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          p.write_text(s)

          print("DG V09: Todas as correcoes aplicadas.")
          PY

      - name: Compilar V09
        run: |
          cd src

          i686-w64-mingw32-gcc \
            -std=gnu99 \
            -O2 \
            -fcommon \
            -I. \
            '-DVERSION="DG-V09"' \
            InterTables.c \
            Interpreter.c \
            memory.c \
            ps2-unpacker.c \
            DisR5900asm.c \
            DisR5900.c \
            MMI.c \
            -o DG-PS2-Unpacker.exe

      - name: Criar pacote
        run: |
          mkdir -p output
          cp src/DG-PS2-Unpacker.exe output/
          cp src/LICENSE output/
          cp -r src output/source

      - name: Disponibilizar download
        uses: actions/upload-artifact@v4
        with:
          name: DG-PS2-Unpacker-V09
          path: output/
