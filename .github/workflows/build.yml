
name: DG PS2 Unpacker V02

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo original
        run: |
          git clone https://github.com/ps2homebrew/ps2-unpacker.git src

      - name: Instalar compilador Windows
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686

      - name: Aplicar correcoes V02
        run: |
          cd src

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("Interpreter.c")
          s = p.read_text()

          old = "void UnknownOpcode() {"

          new = r"""void UnknownOpcode() {
              /* Darlon Games V01 - TEQ */
              if ((cpuRegs.code & 0xFC00003F) == 0x34) {
                  if (cpuRegs.GPR.r[_Rs_].UD[0] !=
                      cpuRegs.GPR.r[_Rt_].UD[0]) {
                      return;
                  }

                  printf("\nDG: TEQ trap at %08X\n",
                         cpuRegs.pc - 4);
                  exit(-1);
              }
          """

          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          pattern = r'(void\s+SYSCALL\s*\([^)]*\)\s*\{)'

          patch = r'''
              /* Darlon Games V02 - GetThreadId */
              if (cpuRegs.GPR.r[3].UL[0] == 0x2F) {
                  cpuRegs.GPR.r[2].UD[0] = 1;
                  printf("DG: GetThreadId = 1\n");
                  return;
              }
          '''

          s, n = re.subn(
              pattern,
              lambda m: m.group(0) + patch,
              s
          )

          assert n == 1, "SYSCALL handler nao localizado"

          p.write_text(s)
          print("Correcoes V01 e V02 aplicadas.")
          PY

      - name: Compilar V02
        run: |
          cd src

          i686-w64-mingw32-gcc \
            -std=gnu99 \
            -O2 \
            -fcommon \
            -I. \
            '-DVERSION="DG-V02"' \
            InterTables.c \
            Interpreter.c \
            memory.c \
            ps2-unpacker.c \
            DisR5900asm.c \
            DisR5900.c \
            MMI.c \
            -o DG-PS2-Unpacker.exe

      - name: Criar pacote
        run: |
          mkdir -p output
          cp src/DG-PS2-Unpacker.exe output/
          cp src/LICENSE output/
          cp -r src output/source

      - name: Disponibilizar download
        uses: actions/upload-artifact@v4
        with:
          name: DG-PS2-Unpacker-V02
          path: output/
